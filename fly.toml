# fly.toml — placeholder app name; actual name is assigned/confirmed by `fly launch`/`fly apps create`.
app = "commission-split-calculator"
primary_region = "iad" # US East — change to whatever region is closest to you

[build]

[env]
  PORT = "3000"
  # DATABASE_URL and CORS_ORIGIN are secrets — set via `fly secrets set`, never committed here.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[deploy]
  # Runs the DB migration before each new release goes live.
  # Requires DATABASE_URL to be set via `fly secrets set` for this command to reach the DB.
  release_command = "node dist/scripts/migrate.js"
